server.port=4517
server.address=127.0.0.1
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.datasource.url=${HEARTH_DB_URL:jdbc:postgresql://127.0.0.1:5432/hearth}
spring.datasource.username=${HEARTH_DB_USERNAME:hearth}
spring.datasource.password=${HEARTH_DB_PASSWORD:hearth}
spring.flyway.enabled=${HEARTH_FLYWAY_ENABLED:false}
spring.autoconfigure.exclude=${HEARTH_AUTOCONFIG_EXCLUDE:org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration}
spring.sql.init.mode=never
hearth.persistence.enabled=${HEARTH_PERSISTENCE_ENABLED:false}
hearth.gateway.anthropic.upstream-base-url=${HEARTH_ANTHROPIC_UPSTREAM_BASE_URL:http://127.0.0.1:4599}
hearth.worker.transport=${HEARTH_WORKER_TRANSPORT:provider}
hearth.worker.host=${HEARTH_WORKER_HOST:127.0.0.1}
hearth.worker.port=${HEARTH_WORKER_PORT:4617}
hearth.worker.control-token=${HEARTH_WORKER_CONTROL_TOKEN:}
hearth.gateway.default-model=${HEARTH_DEFAULT_MODEL:claude-opus-5}
