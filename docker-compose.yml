services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    environment:
      POSTGRES_DB: hearth
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: ${HEARTH_DB_PASSWORD:?HEARTH_DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - hearth_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.5-alpine
    profiles: ["m2"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:0.32.6  # verified manifest; avoid breaking changes on docker pull
    profiles: ["m3"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - hearth_ollama_data:/root/.ollama
    # GPU 支持（有 NVIDIA 卡时取消注释）
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  hearth_pg_data:
  hearth_ollama_data:
